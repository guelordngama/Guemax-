name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification de la syntaxe
        run: npm run check

      - name: Tests de fumée (API + serveur)
        run: npm test
