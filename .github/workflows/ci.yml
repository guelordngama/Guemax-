name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Backend & tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérification de la compilation (syntaxe)
        run: |
          python -m compileall backend admin_tkinter tests

      - name: Tests (API + alertes + Socket.IO)
        run: python -m pytest tests/ -q
