<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeCity Lubumbashi — Carte des alertes en temps réel</title>
  <meta name="description" content="Carte des alertes de sécurité à Lubumbashi, en temps réel. La technologie au service de la sécurité de notre communauté." />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand-icon">🚨</span>
      <div>
        <h1>SafeCity <span>Lubumbashi</span></h1>
        <p class="tagline">La technologie au service de la sécurité communautaire</p>
      </div>
    </a>
    <div class="header-status">
      <span class="presence" title="Citoyens connectés"><span class="dot"></span><span id="presence-count">0</span> en ligne</span>
      <a href="alert.html" class="btn btn-primary">🚨 Signaler une alerte</a>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="stats" id="stats"></section>
      <h2 class="feed-title">Alertes récentes</h2>
      <ul class="feed" id="feed">
        <li class="feed-empty">Chargement…</li>
      </ul>
    </aside>
    <div class="map-wrap">
      <div id="map"></div>
    </div>
  </main>

  <div class="toast-container" id="toasts"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"
          integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
  <script src="/leaflet/map_config.js"></script>
  <script src="/js/gps.js"></script>
  <script src="/js/leaflet_map.js"></script>
  <script src="/js/alerts.js"></script>
</body>
</html>
