<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeCity Lubumbashi — Signalement d'incidents en temps réel</title>
  <meta name="description" content="Signalez les incidents de sécurité à Lubumbashi avec géolocalisation en temps réel. Une technologie au service de la sécurité de notre communauté." />

  <!-- Leaflet (carte OpenStreetMap, sans cle API) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">🚨</span>
      <div>
        <h1>SafeCity <span>Lubumbashi</span></h1>
        <p class="tagline">La technologie au service de la sécurité communautaire</p>
      </div>
    </div>
    <div class="header-status">
      <span class="presence" id="presence" title="Citoyens connectés">
        <span class="dot"></span><span id="presence-count">0</span> en ligne
      </span>
      <button id="btn-report" class="btn btn-primary">➕ Signaler un incident</button>
    </div>
  </header>

  <main class="layout">
    <!-- Panneau lateral -->
    <aside class="sidebar" id="sidebar">
      <section class="stats" id="stats"></section>

      <div class="filters">
        <label for="filter-category">Filtrer</label>
        <select id="filter-category">
          <option value="">Toutes les catégories</option>
        </select>
      </div>

      <h2 class="feed-title">Incidents récents</h2>
      <ul class="feed" id="feed">
        <li class="feed-empty">Aucun incident signalé pour le moment.</li>
      </ul>
    </aside>

    <!-- Carte -->
    <div class="map-wrap">
      <div id="map"></div>
      <button id="btn-locate" class="map-fab" title="Me localiser">🎯</button>
    </div>
  </main>

  <!-- Fenetre modale de signalement -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Signaler un incident</h2>
        <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
      </div>
      <form id="report-form" class="modal-body">
        <div class="field">
          <label for="f-category">Catégorie *</label>
          <select id="f-category" required></select>
        </div>

        <div class="field">
          <label>Niveau de gravité *</label>
          <div class="severity-group" id="severity-group"></div>
        </div>

        <div class="field">
          <label for="f-description">Description *</label>
          <textarea id="f-description" rows="3" maxlength="1000"
            placeholder="Décrivez brièvement ce qui se passe..." required></textarea>
        </div>

        <div class="field">
          <label>Localisation *</label>
          <div class="location-row">
            <button type="button" id="f-use-location" class="btn btn-ghost">📡 Ma position</button>
            <span class="location-hint" id="location-hint">ou cliquez sur la carte</span>
          </div>
          <div class="coords" id="coords-display">Aucune position sélectionnée</div>
        </div>

        <div class="field">
          <label for="f-photo">Photo (facultatif)</label>
          <input type="file" id="f-photo" accept="image/*" />
          <img id="photo-preview" class="photo-preview" alt="" hidden />
        </div>

        <div class="form-error" id="form-error" hidden></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-report">Annuler</button>
          <button type="submit" class="btn btn-primary" id="submit-report">Envoyer le signalement</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
